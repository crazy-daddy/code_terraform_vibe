# Ruff config. The Code: Terraform VS Code extension reads only this file
# (or pyproject.toml) for its built-in Ruff, not the VS Code Ruff settings.
target-version = "py312"
line-length = 120
extend-exclude = [
    "tools",
    "inspirations",
    "internals",
    "devtools/game_update/build_docs",
    "**/node_modules",
    ".pyright-resolved",
    ".claude",
]

[lint]
# Older Ruff (as bundled in editors) checks E402 by default; keep it on here too.
extend-select = ["E402"]
# Every broad except that recovers calls swallowed() first (CODE_GUIDES.md);
# Ruff can't see that, so BLE001 would flag each one.
# RUF046: the game's round() returns a float, so int(round(x)) is needed
# there (tests mirror the game code).
# RUF012: class-level lookup tables are read-only; the fix (ClassVar) isn't
# supported in game.
# SIM102: nested ifs often keep a guard apart from a side-effecting call
# or keep an elif chain parallel; merging them reads worse.
# SIM114: merging if-arms with equal bodies joins distinct cases into one
# long condition and drops their comments.
# SIM118: game objects with .keys() need not iterate like a dict.
# B009/B010: getattr/setattr with a constant name sidestep Pyright where a
# stub lacks the attribute (or to patch builtins in tests).
# RUF015: next(...) raises StopIteration where [0] raises IndexError.
# SIM103, PLC0206, SIM905: style; the explicit form reads as well or better.
ignore = ["BLE001", "RUF046", "RUF012", "SIM102", "SIM114", "SIM118", "B009", "B010", "RUF015", "SIM103", "PLC0206", "SIM905"]

[lint.per-file-ignores]
# Game scripts use globals the game injects at runtime (get_component, sleep,
# OutpostRef, ...). Ruff can't read the stubs; Pyright checks these names.
# TC004: `from user_stubs import x as self` sits under TYPE_CHECKING because
# the game injects `self`; its "fix" would import user_stubs at runtime and fail.
# RUF007/UP035: the game lacks itertools.pairwise (it has a builtin pairwise());
# typing.Callable is the import proven live in game.
# FURB136/PLR1730 (min/max calls), PERF101 (list() copies), TRY201 (raise
# error), PIE810 (endswith tuple), C417 (atomic.py map trick): the written
# form is deliberate or proven in game; the rewrite changes op cost or is
# untested in the game interpreter.
"scripts/**" = ["F821", "TC004", "RUF007", "UP035", "FURB136", "PLR1730", "PERF101", "TRY201", "PIE810", "C417"]
"autoplay/**" = ["F821", "TC004", "RUF007", "UP035", "FURB136", "PLR1730", "PERF101", "TRY201", "PIE810", "C417"]
# In-game code run through the perf tools: same as game code, and the
# unused assignments and bare expressions are the timed work.
"devtools/perf/console_multiline_test.py" = ["F821", "TC004", "RUF007", "UP035", "FURB136", "PLR1730", "PERF101", "TRY201", "PIE810", "C417", "F841", "B015", "B018", "PERF402", "PLR1716"]
"devtools/perf/panel_benchmark.py" = ["F821", "TC004", "RUF007", "UP035", "FURB136", "PLR1730", "PERF101", "TRY201", "PIE810", "C417", "F841", "B015", "B018", "PERF402", "PLR1716"]
# Facade: re-exports the production_* modules' public API.
"scripts/4_controlpanel/lib/production.py" = ["F401"]
